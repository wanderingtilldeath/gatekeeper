server.port=8085
spring.cloud.bootstrap.enabled=true

spring.data.redis.host=localhost
spring.rabbitmq.host=localhost
spring.rabbitmq.connection-timeout=2s

# Chat checkpoint: daily allowance per user, in estimated tokens
ai.daily-tokens=200
# Set true to watch the backup provider take over
ai.primary-fails=false

# Agent checkpoint: which agent may call which tool, which tools need a human, who may approve
ai.agent-per-minute=10
ai.risky=delete_record,send_email
ai.admins=admin
ai.agents.support-bot=read_record,send_email
ai.agents.cleaner-bot=read_record,delete_record

# Incident assistant: a service is unhealthy above this share of bad requests, or this p95 latency (ms)
ai.incident-rate=0.2
ai.incident-slow-ms=1000
