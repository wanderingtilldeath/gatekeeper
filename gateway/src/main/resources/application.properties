spring.application.name=gateway
server.port=8080
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/



spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=lb://auth
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**


spring.cloud.gateway.routes[1].id=svc-java
spring.cloud.gateway.routes[1].uri=lb://svc-java
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/java/**
spring.cloud.gateway.routes[1].filters[0]=RequestRateLimiter=redis-rate-limiter=10,20


spring.redis.host=localhost
spring.redis.port=6379
