spring.application.name=auth
spring.cloud.config.enabled=false
eureka.client.enabled=false

spring.datasource.url=jdbc:h2:mem:auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

auth.jwt.private-key=
auth.jwt.key-file=target/test-jwt-key.pem
auth.jwt.issuer=https://gatekeeper.local
auth.jwt.access-ttl=15m
auth.jwt.refresh-ttl=7d
