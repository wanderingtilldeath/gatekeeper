spring.application.name=auth
server.port=8081

spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.healthcheck.enabled=true

# Postgres (override with DB_URL / DB_USER / DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth}
spring.datasource.username=${DB_USER:auth}
spring.datasource.password=${DB_PASSWORD:auth}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT signing key: PEM in AUTH_JWT_PRIVATE_KEY, else a key is generated once and kept in this file
auth.jwt.private-key=${AUTH_JWT_PRIVATE_KEY:}
auth.jwt.key-file=${AUTH_JWT_KEY_FILE:./data/jwt-key.pem}
auth.jwt.issuer=https://gatekeeper.local
auth.jwt.access-ttl=15m
auth.jwt.refresh-ttl=7d

management.endpoints.web.exposure.include=health,info
