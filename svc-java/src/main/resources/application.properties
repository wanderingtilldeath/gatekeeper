spring.application.name=svc-java
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Shared with the gateway: requests without it are rejected (direct access is forbidden).
# No default on purpose: the service refuses to start without GATEWAY_SECRET.
gateway.shared-secret=${GATEWAY_SECRET}

# /slow and /fail exist for demos only (set DEMO_ENDPOINTS_ENABLED=true to turn them on)
demo.endpoints.enabled=${DEMO_ENDPOINTS_ENABLED:false}

management.endpoints.web.exposure.include=health,info
