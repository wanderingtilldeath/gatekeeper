name: ci

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [auth, gateway, svc-java, config-server, discovery-server]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./... && go test ./...

  images:
    runs-on: ubuntu-latest
    needs: [java, go]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
