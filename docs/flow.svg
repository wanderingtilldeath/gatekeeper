<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">
  <rect width="800" height="320" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g fill="#fff" stroke="#57606a" stroke-width="1.5">
    <rect x="20" y="110" width="120" height="60" rx="8"/>
    <rect x="260" y="110" width="140" height="60" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2.5"/>
    <rect x="620" y="110" width="160" height="60" rx="8"/>
    <rect x="260" y="240" width="140" height="60" rx="8"/>
    <rect x="150" y="20" width="120" height="50" rx="8" stroke-dasharray="5 3"/>
    <rect x="390" y="20" width="120" height="50" rx="8" stroke-dasharray="5 3"/>
  </g>
  <g fill="#1f2328" text-anchor="middle">
    <text x="80" y="145">Client</text>
    <text x="330" y="136" font-weight="bold">Gateway</text><text x="330" y="156" font-size="12">:8080</text>
    <text x="700" y="136">svc-java / svc-go</text><text x="700" y="156" font-size="12">no auth code</text>
    <text x="330" y="266">Auth</text><text x="330" y="286" font-size="12">:8081 JWT</text>
    <text x="210" y="50">Redis</text>
    <text x="450" y="50">Eureka</text>
  </g>
  <g stroke="#8c959f" stroke-width="2" fill="none">
    <path d="M140 140H260M400 140H620M330 170V240"/>
    <path d="M270 70L300 110M390 70L360 110" stroke-dasharray="5 3"/>
  </g>
  <g fill="#57606a" font-size="12" text-anchor="middle">
    <text x="200" y="125">1 Bearer token</text>
    <text x="395" y="210" text-anchor="start">2 validate?</text>
    <text x="510" y="125">3 forward (lb://)</text>
    <text x="170" y="95">rate limit 10/s</text>
    <text x="520" y="95">service lookup</text>
  </g>
  <!-- good request: client > gateway > auth > gateway > service > client, 10s loop -->
  <circle r="8" fill="#1a7f37">
    <animateMotion dur="10s" repeatCount="indefinite" path="M140 140H330V240V140H620H140" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.58;0.6;1"/>
  </circle>
  <!-- rejected request: stopped at gateway -->
  <circle r="8" fill="#cf222e">
    <animateMotion dur="10s" repeatCount="indefinite" path="M140 140H260M260 140H140" keyPoints="0;0;1" keyTimes="0;0.62;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.62;0.63;0.98;1"/>
  </circle>
  <text x="200" y="195" fill="#cf222e" font-size="12" text-anchor="middle">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7;0.72;0.98;1"/>401 / 403 / 429 - never reaches service
  </text>
  <text x="620" y="205" fill="#1a7f37" font-size="12" text-anchor="middle">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.3;0.55;0.6;1"/>valid token - 200 OK
  </text>
</svg>
