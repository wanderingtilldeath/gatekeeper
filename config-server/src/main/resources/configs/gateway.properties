# Tunables served to the gateway by Config Server. The routes themselves live in gateway/src/main/resources/application.yml;
# these values override the defaults referenced there. Change, restart the gateway, no rebuild needed.

# per-user limit on /api/** (tokens refilled per second / bucket size)
gateway.limits.api.rate=100
gateway.limits.api.burst=100

# per-IP limit on /auth/login: each attempt costs 10 tokens, refill 1/s, bucket 30 => 3 quick tries, then ~1 every 10s
gateway.limits.login.rate=1
gateway.limits.login.burst=30
gateway.limits.login.cost=10

# per-IP limit on the other /auth routes (register, refresh)
gateway.limits.auth.rate=1
gateway.limits.auth.burst=5

# how long the gateway waits for svc-java before the circuit breaker's fallback answers 503
gateway.svc-java.response-timeout-ms=3000
