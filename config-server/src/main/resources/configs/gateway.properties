spring.application.name=gateway
server.port=8080

# ACTUATOR (so /actuator/gateway/routes works)
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

# GATEWAY ROUTES
spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=lb://auth
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=svc-java
spring.cloud.gateway.routes[1].uri=lb://svc-java
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/**
